<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Translate - Akıllı Gemini Çeviri</title>
  <meta name="description" content="Google Gemini API destekli, özel üslup, alan ve terimce seçenekli profesyonel makine çevirisi uygulaması.">
  
  <!-- Modern Tipografi: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Üst Başlık ve Logo -->
    <header class="app-header">
      <div class="header-content">
        <div class="logo-wrapper">
          <div class="logo-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m5 8 6 6"/>
              <path d="m4 14 6-6 2-3"/>
              <path d="M2 5h12"/>
              <path d="M7 2h1"/>
              <path d="m22 22-5-10-5 10"/>
              <path d="M14 18h6"/>
            </svg>
          </div>
          <div>
            <h1 class="app-title">Lumina <span class="gradient-text">Translate</span></h1>
            <p class="app-subtitle">Google Gemini API ile Güçlendirilmiş Akıllı Çeviri</p>
          </div>
        </div>

        <div class="header-badge">
          <span class="pulse-dot"></span>
          <span>Ultra Hızlı Mod Hazır</span>
        </div>
      </div>
    </header>

    <!-- Terimce, Alan ve Üslup Kontrol Paneli -->
    <section class="controls-panel">
      <div class="controls-row">
        <div class="selectors-group">
          
          <!-- Alan Seçimi -->
          <div class="selector-item">
            <label class="selector-label" for="domainSelect">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect width="20" height="14" x="2" y="7" rx="2" ry="2"/>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
              </svg>
              Alan:
            </label>
            <div class="select-wrapper">
              <select id="domainSelect" class="custom-select">
                <option value="genel" selected>Genel (Günlük Kullanım)</option>
                <option value="hukuk">Hukuk (Sözleşme & Kanun)</option>
                <option value="tip">Tıp (Sağlık & Medikal)</option>
                <option value="teknik">Teknik (Yazılım & Mühendislik)</option>
                <option value="edebi">Edebi (Roman, Şiir & Sanat)</option>
              </select>
              <span class="select-arrow">▾</span>
            </div>
          </div>

          <!-- Üslup Seçimi -->
          <div class="selector-item">
            <label class="selector-label" for="styleSelect">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 20h9"/>
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
              </svg>
              Üslup:
            </label>
            <div class="select-wrapper">
              <select id="styleSelect" class="custom-select">
                <option value="resmi" selected>Resmi (Siz Dili & Kurumsal)</option>
                <option value="gundelik">Gündelik (Sen Dili & Samimi)</option>
              </select>
              <span class="select-arrow">▾</span>
            </div>
          </div>

        </div>

        <!-- Terimce (Glossary) Aç/Kapa Butonu -->
        <button id="toggleGlossaryBtn" class="glossary-toggle-btn" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
            <path d="M6 6h10"/>
            <path d="M6 10h10"/>
          </svg>
          Terimce (Glossary)
          <span id="glossaryCountBadge" class="glossary-badge hidden">0</span>
        </button>
      </div>

      <!-- Terimce Giriş Alanı -->
      <div id="glossaryContainer" class="glossary-container hidden">
        <label class="glossary-desc" for="glossaryInput">
          Her satıra bir kural yazın: <code>kaynak terim = hedef terim</code> (Model bu terimleri çeviride mutlaka kullanır):
        </label>
        <textarea id="glossaryInput" class="glossary-input" placeholder="Örnek:
pull request = çekme isteği
deployment = canlıya alma
artificial intelligence = yapay zekâ"></textarea>
      </div>
    </section>

    <!-- İki Sütunlu Çeviri Bölümü -->
    <main class="translation-grid">
      
      <!-- Sol Sütun: Kaynak Metin -->
      <section class="translation-card input-card">
        <div class="card-top">
          <div class="lang-select-wrapper">
            <select id="sourceLangSelect" class="lang-select" aria-label="Kaynak Dil">
              <option value="Otomatik Algıla">✨ Dili Algıla</option>
              <option value="İngilizce" selected>İngilizce</option>
              <option value="Türkçe">Türkçe</option>
              <option value="Almanca">Almanca</option>
              <option value="İspanyolca">İspanyolca</option>
              <option value="Fransızca">Fransızca</option>
              <option value="İtalyanca">İtalyanca</option>
              <option value="Rusça">Rusça</option>
              <option value="Japonca">Japonca</option>
              <option value="Arapça">Arapça</option>
            </select>
          </div>

          <div class="card-top-actions">
            <!-- Dilleri Değiştir Butonu -->
            <button id="swapLangsBtn" class="swap-btn" title="Dilleri Değiştir" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="m16 3 4 4-4 4"/>
                <path d="M20 7H4"/>
                <path d="m8 21-4-4 4-4"/>
                <path d="M4 17h16"/>
              </svg>
            </button>
            <!-- Metni Temizle Butonu -->
            <button id="clearSourceBtn" class="action-icon-btn" title="Metni Temizle" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6 6 18"/>
                <path d="m6 6 12 12"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="editor-body">
          <textarea id="sourceText" class="text-area" placeholder="Çevirmek istediğiniz metni buraya yazın veya yapıştırın..." autofocus></textarea>
        </div>

        <div class="card-bottom">
          <span id="sourceCharCount" class="char-counter">0 karakter</span>
          <div class="bottom-actions">
            <button id="translateBtn" class="btn-primary" type="button">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="m5 12 7-7 7 7"/>
                <path d="M12 19V5"/>
              </svg>
              Çevir
            </button>
          </div>
        </div>
      </section>

      <!-- Sağ Sütun: Hedef Çeviri Metni -->
      <section class="translation-card output-card">
        <div class="card-top">
          <div class="lang-select-wrapper">
            <select id="targetLangSelect" class="lang-select" aria-label="Hedef Dil">
              <option value="Türkçe" selected>Türkçe</option>
              <option value="İngilizce">İngilizce</option>
              <option value="Almanca">Almanca</option>
              <option value="İspanyolca">İspanyolca</option>
              <option value="Fransızca">Fransızca</option>
              <option value="İtalyanca">İtalyanca</option>
              <option value="Rusça">Rusça</option>
              <option value="Japonca">Japonca</option>
              <option value="Arapça">Arapça</option>
            </select>
          </div>

          <div class="card-top-actions">
            <!-- Kopyalama İkonu -->
            <button id="copyTopBtn" class="action-icon-btn" title="Çeviriyi Kopyala" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="editor-body">
          <textarea id="targetText" class="text-area output-area" placeholder="Çeviri burada görünecektir..." readonly></textarea>
          
          <!-- Yükleniyor / Çevriliyor Katmanı -->
          <div id="loadingOverlay" class="loading-overlay hidden">
            <div class="spinner"></div>
            <span class="loading-text">Gemini çeviriyor...</span>
          </div>
        </div>

        <div class="card-bottom">
          <span id="targetCharCount" class="char-counter">0 karakter</span>
          <div class="bottom-actions">
            <button id="copyBtn" class="btn-secondary" type="button">
              <svg id="copyBtnIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
              </svg>
              <span id="copyBtnText">Kopyala</span>
            </button>
          </div>
        </div>
      </section>

    </main>

    <!-- Bilgilendirme ve Hata Bildirim Kutusu -->
    <div id="notificationBanner" class="notification-banner error hidden">
      <div class="notification-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" x2="12" y1="8" y2="12"/>
          <line x1="12" x2="12.01" y1="16" y2="16"/>
        </svg>
      </div>
      <div class="notification-body">
        <div id="notificationTitle" class="notification-title">Hata Başlığı</div>
        <div id="notificationAdvice" class="notification-advice">Açıklayıcı Türkçe çözüm adımı.</div>
      </div>
      <button id="notificationCloseBtn" class="notification-close" type="button">✕</button>
    </div>

    <!-- Alt Kısım İpuçları -->
    <footer class="app-footer">
      <span class="shortcut-hint">İpucu: Hızlı çeviri için <kbd>Ctrl</kbd> + <kbd>Enter</kbd> tuşlarına basabilirsiniz.</span>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
